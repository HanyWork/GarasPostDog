      {
        "numbers": ["201025075690", "201221992000"],
         "text": "إحنا Vetanoia، شركة برمجة متخصصة في أنظمة المصورين واستوديوهات التصوير.\n\nبدل ما تسلّم صور عملائك بلينك درايف على الواتساب، عملنا نظام كامل للاستوديو:\n\n✅ كل عميل ليه يوزر وباسورد، يدخل على صفحة باسم الاستوديو ولوجو وألوانك ويلاقي صوره هو بس\n✅ ألبوم متقسم صور وفيديو، وتحميل الألبوم كله أو قسم منه مرة واحدة\n✅ الصور بتفتح مع العميل على أي موبايل أو لابتوب من غير مشاكل\n✅ سجل يوضح مين دخل ومين حمّل وإمتى\n✅ موقع للاستوديو لأعمالك وأفلامك وباقاتك، فيه نموذج حجز\n✅ لوحة تحكم فيها العملاء والألبومات وطلبات الحجز\n✅ مش هتشتري مساحة تخزين، النظام بيشتغل على الدرايف اللي عندك\n✅ ينفع يتربط بدومين باسمك أو باسم الاستوديو بتاعك، وشغال على الموبايل\n\nوإحنا بنجهّز كل حاجة، وانت بتركّز في التصوير.\n\nابعت مسدج ونوريك النظام على صور من شغلك 📸\nhttps://photographer.garassolutions.com/"
      }
