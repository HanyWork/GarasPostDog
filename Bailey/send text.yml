http:
  method: POST
  url: http://localhost:5080/api/messages/text
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "to": "201025075690",
        "text": "إحنا Vetanoia، شركة برمجة متخصصة في أنظمة المصورين واستوديوهات التصوير.

      بدل ما تسلّم صور عملائك بلينك درايف على الواتساب، عملنا نظام كامل للاستوديو:

      ✅ كل عميل ليه يوزر وباسورد، يدخل على صفحة باسم الاستوديو ولوجو وألوانك ويلاقي صوره هو بس
      ✅ ألبوم متقسم صور وفيديو، وتحميل الألبوم كله أو قسم منه مرة واحدة
      ✅ الصور بتفتح مع العميل على أي موبايل أو لابتوب من غير مشاكل
      ✅ سجل يوضح مين دخل ومين حمّل وإمتى
      ✅ موقع للاستوديو لأعمالك وأفلامك وباقاتك، فيه نموذج حجز
      ✅ لوحة تحكم فيها العملاء والألبومات وطلبات الحجز
      ✅ مش هتشتري مساحة تخزين، النظام بيشتغل على الدرايف اللي عندك
      ✅ ينفع يتربط بدومين باسمك او باسم الاستوديو بتاعك، وشغال على الموبايل

      وإحنا بنجهّز كل حاجة، وانت بتركّز في التصوير.

      ابعت مسدج ونوريك النظام على صور من شغلك 📸
      https://photographer.garassolutions.com/"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
