info:
  name: AddRouteLocation
  type: http
  seq: 76

http:
  method: POST
  url: "{{BaseCoreUrl}}/api/Transportation/AddRouteLocation"
  headers:
    - name: CompanyName
      value: "{{CompanyName}}"
    - name: UserToken
      value: "{{UserToken}}"
  body:
    type: json
    data: |-
      {
        "RouteId": 1,
        "Latitude": 10.24578578,
        "Longitude": 14.5785782
      }
  auth: inherit

runtime:
  variables:
    - name: CompanyName
      value: transportion

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
