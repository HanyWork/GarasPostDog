                "text": "Σαφηνίζεις γάρ τά θεῖα τοῖς πέρασι, δυσεφίκτων τε νοημάτων τήν δήλωσιν, μακάριε, Τριάδα πᾶσι, Μάξιμε, ἀναξηρύττων τρανῶς ὑπερούσιον, ἄναρχον. Ὁ οἶκος. Τῶν ἱερέων ἡ κρηπίς, ἡ βάσις τῶν δογμάτων, ἡ σάλπιγξ τῆς σοφίας, μαρτύρων ἡ ἀκρότης καί τῶν πιστῶν ὁ στηριγμός κόσμῳ προανίσχει, Μάξιμος ὁ θαυμαστός διά τῆς θείας αὐτοῦ μνήμης σήμερα. Τούτου οὖν πρός τήν λάμψιν ἀνάστητε πάντες, τήν παῤῥησίαν καί τόν ζῆλον εὐφημοῦντες, ὅν ἔδειξεν ὑπέρ εὐσεβείας, δι᾿ ἥν ἀληθῶς ποιμήν ὑπέρ ποίμνης παρετάξατο στεῤῥῶς κατά τόν λύκων, οὕς καταβαλών, βραβείοις νίκης ἐστέφθη· Τριάδα πᾶσιν ἀνακηρύττων τρανῶς ὑπερούσιον, ἄναρχον. (217) ∆όξα. Ἦχος γ΄. Τήν ὡραιότητα. Τά κατορθώματα τῆς πολειτείας σου, πάντων φωτίζουσι τά διαβήματα, Μάξιμε, πάτερ ἀληθῶς τῶν πίστει μιμουμένων σε· ὅθεν τούς ἐκ πόθου σε μακαρίζοντας πάντοτε σῶζε ταῖς πρεσβείαις σου ἀπό πάσης στενώσεως, Χριστόν τόν ἀγαθόν ἱκετεύων, μάκαρ ἀξιοθαύμαστε. ᾨδή δ΄. Εἰσακήκοα, Κύριε."
              }
